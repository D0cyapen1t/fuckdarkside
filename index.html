<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | FUCKDARKSIDEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&display=swap');

        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: 'Space Grotesk', sans-serif; overflow: hidden; 
            user-select: none;
        }
        @media (pointer: fine) {
            body { cursor: none; }
        }

        #preloader {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1); cursor: pointer;
        }
        .loader-text {
            font-size: 1.75rem; font-weight: 900; letter-spacing: 0.2em; text-align: center;
            animation: pulse 1s infinite alternate;
        }
        .loader-sub {
            font-size: 0.7rem; letter-spacing: 0.3em; color: rgba(255,255,255,0.4);
            margin-top: 1rem; text-transform: uppercase; text-align: center;
        }
        @keyframes pulse {
            from { opacity: 0.5; filter: blur(2px); text-shadow: 0 0 10px #ff00c1; }
            to { opacity: 1; filter: blur(0); text-shadow: 0 0 20px #00fff9; }
        }

        .noise {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .cursor-dot {
            width: 5px; height: 5px; background: #fff; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 10000; display: none;
        }
        .cursor-ring {
            width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999;
            will-change: transform; transition: width 0.2s, height 0.2s, border-color 0.2s; display: none;
        }
        @media (pointer: fine) {
            .cursor-dot, .cursor-ring { display: block; }
        }

        .cursor-trail {
            position: fixed; width: 6px; height: 6px; border-radius: 50%;
            pointer-events: none; z-index: 9998; background: #00fff9;
            transform: translate(-50%, -50%);
            animation: trailFade 0.6s linear forwards;
        }
        @keyframes trailFade {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; box-shadow: 0 0 8px #00fff9; }
            100% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; background: #ff00c1; }
        }

        /* Digital Click Animations */
        .click-cross {
            position: fixed; color: #00fff9; font-family: monospace; font-size: 24px; line-height: 1;
            pointer-events: none; z-index: 10001; margin-top: -2px;
            transform: translate(-50%, -50%);
            animation: crossAnim 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes crossAnim {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 1; text-shadow: 0 0 10px #00fff9; }
            100% { transform: translate(-50%, -50%) scale(2) rotate(90deg); opacity: 0; color: #ff00c1; text-shadow: 0 0 20px #ff00c1; }
        }
        
        .click-pixel {
            position: fixed; width: 3px; height: 3px; background: #ff00c1;
            pointer-events: none; z-index: 10001;
            transform: translate(-50%, -50%);
            animation: pixelAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes pixelAnim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; box-shadow: 0 0 5px #ff00c1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }

        .glitch { position: relative; display: inline-block; }
        @media (pointer: fine) {
            .glitch { cursor: none; }
            .glitch::before, .glitch::after {
                content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                opacity: 0; pointer-events: none;
            }
            .glitch:hover::before {
                left: 2px; text-shadow: -2px 0 #ff00c1; clip: rect(44px, 450px, 56px, 0);
                animation: glitch-anim 5s infinite linear alternate-reverse; opacity: 1;
            }
            .glitch:hover::after {
                left: -2px; text-shadow: -2px 0 #00fff9; clip: rect(44px, 450px, 56px, 0);
                animation: glitch-anim2 5s infinite linear alternate-reverse; opacity: 1;
            }
        }
        @keyframes glitch-anim { 0% { clip: rect(10px, 9999px, 86px, 0); } 20% { clip: rect(72px, 9999px, 14px, 0); } 40% { clip: rect(31px, 9999px, 94px, 0); } 60% { clip: rect(82px, 9999px, 44px, 0); } 80% { clip: rect(23px, 9999px, 66px, 0); } 100% { clip: rect(61px, 9999px, 21px, 0); } }
        @keyframes glitch-anim2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 20% { clip: rect(21px, 9999px, 9px, 0); } 40% { clip: rect(43px, 9999px, 78px, 0); } 60% { clip: rect(12px, 9999px, 34px, 0); } 80% { clip: rect(88px, 9999px, 5px, 0); } 100% { clip: rect(34px, 9999px, 87px, 0); } }

        .glass-btn {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            outline: none !important; -webkit-tap-highlight-color: transparent;
        }
        @media (pointer: fine) { .glass-btn { cursor: none; } }
        .glass-btn-3d { transform-style: preserve-3d; transition: transform 0.1s; }
        .glass-btn-content { transform: translateZ(40px); }
        .glass-btn-glow {
            position: absolute; inset: 0; background: radial-gradient(circle at var(--x) var(--y), rgba(255,255,255,0.1), transparent 40%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .glass-btn:hover .glass-btn-glow { opacity: 1; }

        button, input, a, *:focus { outline: none !important; box-shadow: none !important; }

        .skill-tag {
            position: absolute; padding: 0.4rem 0.8rem; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            white-space: nowrap; font-size: 0.75rem; font-weight: 500; user-select: none; 
            transition: filter 0.3s; opacity: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @media (pointer: fine) { .skill-tag { cursor: none; } }
        .skill-tag.visible { opacity: 1; transition: opacity 1s, filter 0.3s; }
        .skill-tag:hover { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); border-color: rgba(255,255,255,0.5); }

        #audio-dock {
            transform: translateX(-50%) translateY(100px); opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 90vw;
        }
        @media (pointer: fine) { #audio-dock { cursor: none; } }
        #audio-dock.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .audio-bars .bar { transition: all 0.2s; }
        .audio-bars.playing .bar:nth-child(1) { animation: eq 0.8s ease-in-out infinite alternate; }
        .audio-bars.playing .bar:nth-child(2) { animation: eq 0.5s ease-in-out infinite alternate-reverse; }
        .audio-bars.playing .bar:nth-child(3) { animation: eq 1s ease-in-out infinite alternate; }
        .audio-bars.playing .bar:nth-child(4) { animation: eq 0.6s ease-in-out infinite alternate-reverse; }
        @keyframes eq { 0% { height: 3px; background: #ff00c1; box-shadow: 0 0 5px #ff00c1; } 100% { height: 16px; background: #00fff9; box-shadow: 0 0 10px #00fff9; } }

        input[type=range] { -webkit-appearance: none; background: transparent; width: 45px; transition: width 0.3s; }
        @media (pointer: fine) { input[type=range] { cursor: none; } }
        #audio-dock:hover input[type=range] { width: 70px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 8px; width: 8px; border-radius: 50%;
            background: #fff; margin-top: -2.5px; transition: background 0.3s;
        }
        input[type=range]:hover::-webkit-slider-thumb { background: #00fff9; box-shadow: 0 0 8px #00fff9; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; }

        #clock-widget {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 8px 12px; font-family: monospace; font-size: 10px;
            display: flex; flex-direction: column; gap: 3px; opacity: 0;
            transform: translateY(-20px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        @media(min-width: 640px) {
            #clock-widget { top: 24px; left: 24px; padding: 10px 16px; font-size: 11px; border-radius: 14px; gap: 4px; }
        }
        #clock-widget.active { opacity: 1; transform: translateY(0); }

        #terminal-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            z-index: 12000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 1rem;
        }
        #terminal-modal.active { opacity: 1; pointer-events: auto; }
        .terminal-box {
            width: 100%; max-width: 650px; height: 380px; background: #0a0a0a;
            border: 1px solid rgba(0,255,249,0.3); border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,255,249,0.15);
        }
        .terminal-header {
            background: #121212; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 12px;
        }
        .terminal-body {
            flex: 1; padding: 16px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #00fff9;
            display: flex; flex-direction: column; gap: 6px;
        }
        .terminal-input-line {
            display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #050505;
            border-top: 1px solid rgba(255,255,255,0.08); font-family: monospace;
        }
        .terminal-input {
            background: transparent; border: none; color: #fff; outline: none; flex: 1; font-family: monospace; font-size: 12px;
            cursor: text !important;
        }

        .reveal { opacity: 0; transform: scale(0.9) translateY(30px); }
        .reveal.active { animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .d-1 { animation-delay: 0.1s; } .d-2 { animation-delay: 0.2s; } .d-3 { animation-delay: 0.3s; }
        @keyframes popIn { to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>

            <p class="reveal d-2 text-white/50 text-[11px] sm:text-xs tracking-widest uppercase mb-6 sm:mb-8 font-medium text-center">digital & web dev</p>

            <div class="reveal d-3 w-full flex flex-col gap-4 perspective-[1000px]">
                <a href="https://t.me/fuckdarksidee" target="_blank" rel="noopener" class="glass-btn glass-btn-3d block w-full relative rounded-2xl overflow-hidden group">
                    <div class="glass-btn-glow"></div>
                    <div class="glass-btn-content px-5 sm:px-6 py-3.5 sm:py-4 flex items-center justify-between pointer-events-none">

                                <img src="ava.png" alt="Avatar" class="w-10 h-10 rounded-full object-cover bg-zinc-900 border border-white/10 pointer-events-none">

    <script>
        let isStarted = false;
        const isMobile = window.matchMedia("(pointer: coarse)").matches;

        const playlist = ['1.mp3', '2.mp3', '3.mp3', '4.mp3', '5.mp3', '6.mp3', '7.mp3', '8.mp3', '9.mp3', '10.mp3'];
        let currentTrackIdx = 0;
        const music = document.getElementById('bg-music');
        const trackNameEl = document.getElementById('track-name');

        function loadTrack(idx) {
            music.src = playlist[idx];
            trackNameEl.innerText = `TRACK ${idx + 1}`;
            music.load();
        }
        loadTrack(currentTrackIdx);

        document.getElementById('preloader').addEventListener('click', () => {
            if (isStarted) return;
            isStarted = true;

            document.getElementById('preloader').style.transform = 'translateY(-100%)';

            music.volume = document.getElementById('vol-slider').value;
            music.play().then(() => {
                document.querySelector('.audio-bars').classList.add('playing');
                document.getElementById('play-icon').classList.add('hidden');
                document.getElementById('pause-icon').classList.remove('hidden');
                document.getElementById('play-btn').classList.replace('text-white/50', 'text-[#00fff9]');
                window.isPlaying = true;
                isPlaying = true;
            }).catch(() => {});

            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
                document.querySelectorAll('.skill-tag').forEach(el => el.classList.add('visible'));
                document.getElementById('audio-dock').classList.add('active');
                document.getElementById('clock-widget').classList.add('active');
            }, 400);
        });

        music.addEventListener('ended', () => {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            loadTrack(currentTrackIdx);
            music.play();
        });

        document.getElementById('next-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            loadTrack(currentTrackIdx);
            if (window.isPlaying || isPlaying) music.play();
        });

        function updateClocks() {
            const now = new Date();
            const timeMsk = now.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour12: false });
            const timeKiev = now.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Kyiv', hour12: false });
            
            document.getElementById('clock-msk').innerText = timeMsk;
            document.getElementById('clock-kiev').innerText = timeKiev;
        }
        setInterval(updateClocks, 1000);
        updateClocks();

        const terminalModal = document.getElementById('terminal-modal');
        const terminalTrigger = document.getElementById('terminal-trigger');
        const termClose = document.getElementById('term-close');
        const termField = document.getElementById('terminal-field');
        const termOutput = document.getElementById('terminal-output');

        function toggleTerminal() {
            terminalModal.classList.toggle('active');
            if (terminalModal.classList.contains('active')) {
                termField.focus();
            }
        }

        terminalTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTerminal();
        });

        termClose.addEventListener('click', () => toggleTerminal());

        window.addEventListener('keydown', (e) => {
            if (e.key === '`' || e.key === '~' || (e.key === 'ё' || e.key === 'Ё')) {
                e.preventDefault();
                toggleTerminal();
            }
            if (e.key === 'Escape' && terminalModal.classList.contains('active')) {
                terminalModal.classList.remove('active');
            }
        });

        termField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = termField.value.trim().toLowerCase();
                if (!cmd) return;
                
                const cmdLine = document.createElement('div');
                cmdLine.innerHTML = `<span class="text-cyan-400">guest@sys:~$</span> ${escapeHtml(termField.value)}`;
                termOutput.appendChild(cmdLine);

                const resLine = document.createElement('div');
                resLine.className = 'text-white/80';

                switch(cmd) {
                    case 'help':
                        resLine.innerHTML = `Available commands:<br>
                        - <span class="text-[#00fff9]">music</span>: toggle play/pause track<br>
                        - <span class="text-[#00fff9]">matrix</span>: toggle matrix effects<br>
                        - <span class="text-[#00fff9]">whoami</span>: show user profile<br>
                        - <span class="text-[#00fff9]">ping</span>: test connection latency<br>
                        - <span class="text-[#00fff9]">clear</span>: clear terminal screen`;
                        break;
                    case 'music':
                        playBtn.click();
                        resLine.innerText = 'Audio playback toggled.';
                        break;
                    case 'matrix':
                        resLine.innerText = 'Matrix frequency modulated successfully.';
                        break;
                    case 'ping':
                        resLine.innerText = 'PING 127.0.0.1 (127.0.0.1): 56 data bytes. 56 bytes from 127.0.0.1: icmp_seq=1 time=0.231 ms';
                        break;
                    case 'clear':
                        termOutput.innerHTML = '';
                        resLine.innerText = '';
                        break;
                    default:
                        resLine.innerHTML = `Command not recognized: <span class="text-pink-400">${escapeHtml(termField.value)}</span>. Type "help".`;
                }

                if (resLine.innerText || resLine.innerHTML) {
                    termOutput.appendChild(resLine);
                }

                termField.value = '';
                termOutput.scrollTop = termOutput.scrollHeight;
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.addEventListener('click', (e) => {
            if (terminalModal.contains(e.target) || isMobile) return;

            const cross = document.createElement('div');
            cross.className = 'click-cross'; cross.innerText = '+';
            cross.style.left = e.clientX + 'px'; cross.style.top = e.clientY + 'px';
            document.body.appendChild(cross);
            setTimeout(() => cross.remove(), 500);

            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.className = 'click-pixel';
                p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
                const angle = (Math.PI * 2 / 8) * i; const dist = 40 + Math.random() * 40;
                p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        });

        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const audioBars = document.querySelector('.audio-bars');
        const volSlider = document.getElementById('vol-slider');
        
        volSlider.addEventListener('input', (e) => { music.volume = e.target.value; });

        let isPlaying = false;
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (window.isPlaying || isPlaying) {
                music.pause();
                audioBars.classList.remove('playing');
                playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden');
                playBtn.classList.replace('text-[#00fff9]', 'text-white/50');
                isPlaying = false;
                window.isPlaying = false;
            } else {
                music.play();
                audioBars.classList.add('playing');
                playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden');
                playBtn.classList.replace('text-white/50', 'text-[#00fff9]');
                isPlaying = true;
                window.isPlaying = true;
            }
        });

        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let ringX = mouseX, ringY = mouseY;
        let isHovering = false;
        let lastTrailTime = 0;

        if (!isMobile) {
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX; mouseY = e.clientY;
                dot.style.transform = `translate(${mouseX - 2.5}px, ${mouseY - 2.5}px)`;

                const now = performance.now();
                if (now - lastTrailTime > 40) {
                    lastTrailTime = now;
                    const trail = document.createElement('div');
                    trail.className = 'cursor-trail';
                    trail.style.left = mouseX + 'px';
                    trail.style.top = mouseY + 'px';
                    document.body.appendChild(trail);
                    setTimeout(() => trail.remove(), 600);
                }
            });

            function animateCursor() {
                ringX += (mouseX - ringX) * 0.15;
                ringY += (mouseY - ringY) * 0.15;
                let offset = isHovering ? 30 : 15;
                ring.style.transform = `translate(${ringX - offset}px, ${ringY - offset}px)`;
                requestAnimationFrame(animateCursor);
            }
            animateCursor();

            document.querySelectorAll('a, button, input[type="range"], .glitch, img, #preloader').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    isHovering = true;
                    ring.style.width = '60px'; ring.style.height = '60px'; 
                    ring.style.borderColor = '#00fff9';
                });
                el.addEventListener('mouseleave', () => {
                    isHovering = false;
                    ring.style.width = '30px'; ring.style.height = '30px';
                    ring.style.borderColor = 'rgba(255,255,255,0.5)';
                });
            });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let codeStrings = [];
        const snippets = ['0x00F8', 'ptr->next', 'sys.override()', 'chmod 777', 'alloc(size)', '[kernel_hook]', 'jmp eax', 'FUCKDARKSIDEE', '01001011', 'root@localhost', 'inject.dll'];

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                
                if (!isMobile) {
                    const dx = mouseX - this.x; const dy = mouseY - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 180) { this.x -= dx * 0.015; this.y -= dy * 0.015; }
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        class CodeString {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vy = -0.2 - Math.random() * 0.6;
                this.text = snippets[Math.floor(Math.random() * snippets.length)];
                this.opacity = Math.random() * 0.12 + 0.04;
                this.size = Math.floor(Math.random() * 6 + 9);
            }
            update() {
                this.y += this.vy;
                if (this.y < -50) {
                    this.y = canvas.height + 50; this.x = Math.random() * canvas.width;
                    this.text = snippets[Math.floor(Math.random() * snippets.length)];
                }
            }
            draw() {
                ctx.font = `${this.size}px monospace`;
                ctx.fillStyle = `rgba(0, 255, 249, ${this.opacity})`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        const particleCount = isMobile ? 45 : 120;
        const codeCount = isMobile ? 8 : 20;

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        for (let i = 0; i < codeCount; i++) codeStrings.push(new CodeString());

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            codeStrings.forEach(c => { c.update(); c.draw(); });
            particles.forEach(p => { p.update(); p.draw(); });

            if (!isMobile) {
                for(let i=0; i<particles.length; i++) {
                    for(let j=i; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 90) { 
                            ctx.strokeStyle = `rgba(255,255,255,${0.15 - dist/600})`;
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        document.querySelectorAll('.glass-btn-3d').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                if (isMobile) return;
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                btn.style.setProperty('--x', `${x}px`); btn.style.setProperty('--y', `${y}px`);
                const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -15;
                const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 15;
                btn.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
            });
            btn.addEventListener('mouseleave', () => {
                if (isMobile) return;
                btn.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        });

        const skillsList = [
            'React', 'GLSL', 'Node.js', 'Python', 'Three.js', 'WebGL', 'Physics', 'Figma'
        ];
        const container = document.getElementById('skills-container');
        const skillNodes = [];

        skillsList.forEach((skill) => {
            const el = document.createElement('div');
            el.className = 'skill-tag pointer-events-auto';
            el.innerText = skill;
            const x = Math.random() * Math.max(50, window.innerWidth - 140);
            const y = Math.random() * Math.max(50, window.innerHeight - 80);
            el.style.left = `${x}px`; el.style.top = `${y}px`;
            container.appendChild(el);
            skillNodes.push({ 
                el, x, y, 
                vx: (Math.random() - 0.5) * (isMobile ? 0.8 : 1.2), 
                vy: (Math.random() - 0.5) * (isMobile ? 0.8 : 1.2) 
            });
        });

        function animateSkills() {
            skillNodes.forEach(node => {
                node.x += node.vx; node.y += node.vy;
                
                if (node.x <= 10 || node.x >= window.innerWidth - 110) node.vx *= -1;
                if (node.y <= 10 || node.y >= window.innerHeight - 50) node.vy *= -1;
                
                if (!isMobile) {
                    const dx = mouseX - (node.x + 40); 
                    const dy = mouseY - (node.y + 12);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 200) { 
                        node.x -= (dx / dist) * 2; 
                        node.y -= (dy / dist) * 2; 
                    }
                }
                
                node.el.style.transform = `translate(${node.x - parseFloat(node.el.style.left)}px, ${node.y - parseFloat(node.el.style.top)}px)`;
            });
            requestAnimationFrame(animateSkills);
        }
        animateSkills();
    </script>
</body>
</html>
